version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - ICDAS_MODEL_PATH=/app/models/icdas/current/deploy.keras
      - ICDAS_DEPLOY_MODEL_PATH=/app/models/icdas/current/deploy.keras
      - ICDAS_NUM_CLASSES=5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

  ml-train:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    volumes:
      - ./data/icdas:/app/data/icdas
      - ./models:/app/models
    profiles:
      - train
    command: ["python", "train.py", "--config", "configs/default.yaml"]
