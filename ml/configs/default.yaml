# ============================================================
# ICDAS DENTAL CARIES DETECTION
# ============================================================

# Supported classes: ICDAS 0, 1, 2, 3, 4
# ICDAS 5 and 6 are NOT supported.

num_classes: 5


# ============================================================
# CLASSIFICATION
# ============================================================

# Standard 5-class classification
ordinal_regression: false

loss: sparse_categorical_crossentropy


# ============================================================
# MODEL
# ============================================================

backbone: mobilenet_v3_small

use_attention: cbam

image_size: 224

dropout: 0.4


# ============================================================
# TRAINING
# ============================================================

batch_size: 8

learning_rate: 0.0003

fine_tune_learning_rate: 0.00001

weight_decay: 0.0001

head_epochs: 30

fine_tune_epochs: 40

fine_tune_layers: 30


# ============================================================
# INFERENCE
# ============================================================

confidence_threshold: 0.50


# ============================================================
# AUGMENTATION
# ============================================================

augmentation: true


# ============================================================
# PREPROCESSING
# ============================================================

use_roi_detection: true

use_clahe: true

use_specular_reduction: true

color_normalize: true


# ============================================================
# EXPERIMENT
# ============================================================

experiment_name: icdas_mobilenet_cbam_5class_weighted