# ============================================================
# ICDAS DENTAL CARIES DETECTION
# ============================================================

# Classes: ICDAS 0, 1, 2, 3, 4  (5 classes)
# Previous versions used ICDAS 0–6 (7 classes). That output head
# is incompatible and must not be reused.

num_classes: 5

# IMPORTANT
ordinal_regression: true

loss: ordinal


# ============================================================
# MODEL
# ============================================================

backbone: mobilenet_v3_small

use_attention: cbam

image_size: 224

dropout: 0.3


# ============================================================
# TRAINING
# ============================================================

batch_size: 8

learning_rate: 0.0001

fine_tune_learning_rate: 0.00001

weight_decay: 0.0001

head_epochs: 20

fine_tune_epochs: 30

fine_tune_layers: 30


# ============================================================
# INFERENCE
# ============================================================

confidence_threshold: 0.55


# ============================================================
# AUGMENTATION
# ============================================================

# Applied to the training split only. Validation and test images
# are never augmented, which avoids leakage of augmented copies.

augmentation: true


# ============================================================
# PREPROCESSING
# ============================================================

use_roi_detection: true

use_clahe: true

use_specular_reduction: true

color_normalize: true


# ============================================================
# EXPERIMENT
# ============================================================

experiment_name: icdas_mobilenet_cbam_ordinal
