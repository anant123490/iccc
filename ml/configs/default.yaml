# ============================================================
# ICDAS 0-4 CLASSIFIER — V6
# ============================================================

experiment_name: "icdas_mobilenet_cbam_5class_v6"

# ============================================================
# CLASSES
# ============================================================

num_classes: 5

# ICDAS classes:
# 0, 1, 2, 3, 4
#
# ICDAS 5 and 6 are intentionally OUT OF SCOPE.
# Do NOT remap 5/6.

# ============================================================
# IMAGE / DATASET
# ============================================================

image_size: 224

batch_size: 8

dataset_root: "data/training/versions/v77"

# ============================================================
# MODEL
# ============================================================

backbone: "MobileNetV3Small"

use_attention: "cbam"

dropout: 0.30

pretrained: true

# ============================================================
# CLASSIFICATION
# ============================================================

# V6 is a controlled softmax baseline.
ordinal_regression: false

loss: "sparse_categorical_crossentropy"

# ============================================================
# OPTIMIZATION
# ============================================================

learning_rate: 0.0001

fine_tune_learning_rate: 0.00001

weight_decay: 0.0001

# ============================================================
# TRAINING
# ============================================================

head_epochs: 20

fine_tune_epochs: 30

fine_tune_layers: 20

# ============================================================
# AUGMENTATION
# ============================================================

augmentation: true

# ============================================================
# PREPROCESSING
# ============================================================

# Keep these OFF for the controlled V6 experiment.
# We do not want ROI/CLAHE/specular/color normalization
# to change the visual ICDAS cues during this experiment.

use_roi_detection: false

use_clahe: false

use_specular_reduction: false

color_normalize: false

# ============================================================
# CALLBACKS
# ============================================================

early_stopping_patience: 8

reduce_lr_patience: 3

# ============================================================
# INFERENCE
# ============================================================

confidence_threshold: 0.55

# MobileNetV3Small with built-in preprocessing expects
# image values in [0,255].

mobilenet_input_range: "0-255"

# ============================================================
# CHECKPOINT
# ============================================================

# Do not overwrite the root deployment checkpoint during
# experimentation.

overwrite_root_checkpoints: false