# ============================================================
# ICDAS 0-4 CONFIGURATION
# ============================================================

experiment_name: "icdas_mobilenet_cbam_5class_v4"

# ============================================================
# CLASSES
# ============================================================

num_classes: 5

# 0 = Sound
# 1 = First visual change
# 2 = Distinct visual change
# 3 = Localized enamel breakdown
# 4 = Underlying dark shadow / dentin involvement

# ============================================================
# IMAGE
# ============================================================

image_size: 224

# ============================================================
# DATASET
# ============================================================

batch_size: 8

# ============================================================
# MODEL
# ============================================================

backbone: "MobileNetV3Small"

use_attention: "cbam"

dropout: 0.30

pretrained: true

# ============================================================
# CLASSIFICATION
# ============================================================

ordinal_regression: false

loss: "sparse_categorical_crossentropy"

# ============================================================
# OPTIMIZER
# ============================================================

learning_rate: 0.0001

fine_tune_learning_rate: 0.00001

weight_decay: 0.0001

# ============================================================
# STAGE 1
# ============================================================

head_epochs: 20

# ============================================================
# STAGE 2
# ============================================================

fine_tune_epochs: 30

fine_tune_layers: 20

# ============================================================
# AUGMENTATION
# ============================================================

augmentation: true

# ============================================================
# PREPROCESSING
# ============================================================
# IMPORTANT:
# These must remain identical between training and inference.

use_roi_detection: false

use_clahe: false

use_specular_reduction: false

color_normalize: false

# ============================================================
# CALLBACKS
# ============================================================

early_stopping_patience: 8

reduce_lr_patience: 3

# ============================================================
# INFERENCE
# ============================================================

confidence_threshold: 0.55

# ============================================================
# MODEL INPUT CONTRACT
# ============================================================
# MobileNetV3 with ImageNet weights uses its built-in
# preprocessing and therefore expects pixel values in [0,255].

mobilenet_input_range: "0-255"